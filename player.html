<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-player">
  <div id="header">
    <h1 id="title"></h1>
    <audio id="player" controls playsinline></audio>
    <div class="controls">
      <button class="ctrl-btn" id="btn-prev">&#9664;&#9664;</button>
      <button class="ctrl-btn" id="btn-next">&#9654;&#9654;</button>
      <button class="ctrl-btn" id="btn-theme" title="Mode dia / nit">&#9728;&#65039;</button>
      <button class="ctrl-btn" id="btn-youtube" title="Veure v&#237;deo">&#9654; Video</button>
      <button class="ctrl-btn" id="btn-lrc" title="Mode karaoke">&#127908;</button>
      <button class="ctrl-btn" id="btn-font-down" title="Reduir lletra">A&#8722;</button>
      <button class="ctrl-btn" id="btn-font-up"   title="Augmentar lletra">A+</button>
      <button class="ctrl-btn" id="btn-share" title="Compartir can&#231;&#243;"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button>
      <a class="back" id="btn-back" href="#" title="Torna a la playlist">&#8592;</a>
    </div>
  </div>
  <div id="lyrics-container">
    <div id="lyrics" class="loading">Carregant...</div>
  </div>
  <div id="tap-overlay">
    <div id="tap-icon">&#9654;&#65039;</div>
    <div id="tap-label">Toca per reproduir</div>
  </div>

  <script>
    function toAudioUrl(mp4url) {
      return mp4url.replace('/video/upload/', '/video/upload/f_mp3/').replace(/\.mp4$/, '.mp3');
    }

    const params       = new URLSearchParams(location.search);
    const playlistName = params.get('playlist') || '';
    let   currentIdx   = parseInt(params.get('idx') || '0', 10);
    let   playlist     = [];

    const audioEl         = document.getElementById('player');
    const overlay         = document.getElementById('tap-overlay');
    const btnPrev         = document.getElementById('btn-prev');
    const btnNext         = document.getElementById('btn-next');
    const btnTheme        = document.getElementById('btn-theme');
    const btnYoutube      = document.getElementById('btn-youtube');
    const btnLrc          = document.getElementById('btn-lrc');
    const btnFontUp       = document.getElementById('btn-font-up');
    const btnFontDown     = document.getElementById('btn-font-down');
    const btnShare        = document.getElementById('btn-share');
    const btnBack         = document.getElementById('btn-back');
    const lyricsEl        = document.getElementById('lyrics');
    const lyricsContainer = document.getElementById('lyrics-container');

    if (playlistName) btnBack.href = `playlist.html?playlist=${playlistName}`;

    // ── font size ─────────────────────────────────────────────────────────
    const FONT_SIZES = [0.82, 0.91, 1.0, 1.12, 1.26, 1.42, 1.6];
    let fontIdx = 2;
    function applyFontSize() {
      lyricsEl.style.fontSize = FONT_SIZES[fontIdx] + 'rem';
      btnFontDown.disabled = fontIdx === 0;
      btnFontUp.disabled   = fontIdx === FONT_SIZES.length - 1;
    }
    btnFontUp.addEventListener('click',   () => { if (fontIdx < FONT_SIZES.length - 1) { fontIdx++; applyFontSize(); } });
    btnFontDown.addEventListener('click', () => { if (fontIdx > 0) { fontIdx--; applyFontSize(); } });
    applyFontSize();

    // ── day / night ────────────────────────────────────────────────────────
    let isDay = false;
    btnTheme.addEventListener('click', () => {
      isDay = !isDay;
      document.body.classList.toggle('day', isDay);
      btnTheme.innerHTML = isDay ? '&#127769;' : '&#9728;&#65039;';
    });

    // ── youtube ────────────────────────────────────────────────────────────
    btnYoutube.addEventListener('click', () => {
      const song = playlist[currentIdx];
      if (song && song.youtube) window.open(song.youtube, '_blank', 'noopener');
    });

    // ── share ──────────────────────────────────────────────────────────────
    function getShareUrl() {
      const url = new URL('player.html', location.href);
      url.search = '';
      if (playlistName) url.searchParams.set('playlist', playlistName);
      url.searchParams.set('idx', String(currentIdx));
      return url.href;
    }

    btnShare.addEventListener('click', async () => {
      const url = getShareUrl();
      const shareText = 'Crec que aquesta cançó et pot agradar. Tens la lletra, versió karaoke i link al video - ' + url;
      if (navigator.share) {
        try {
          await navigator.share({ text: shareText });
        } catch (e) {
          // cancelled or error — do nothing
        }
      } else {
        try {
          await navigator.clipboard.writeText(shareText);
          alert('Enllaç copiat al porta-retalls!');
        } catch {
          prompt('Copia aquest text:', shareText);
        }
      }
    });

    // ── plain lyrics ───────────────────────────────────────────────────────
    async function loadLyrics(url) {
      lyricsEl.className = 'loading';
      lyricsEl.textContent = 'Carregant lletra...';
      lyricsContainer.scrollTop = 0;
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error();
        lyricsEl.className = '';
        lyricsEl.textContent = (await resp.text()).trimEnd() + '\n\n\n';
      } catch {
        lyricsEl.className = 'loading';
        lyricsEl.textContent = "No s'ha pogut carregar la lletra.";
      }
    }

    // ── karaoke (LRC) ──────────────────────────────────────────────────────
    let lrcMode   = false;
    let lrcLines  = [];   // [{time: seconds, text}]
    let lrcActive = -1;

    function parseLrc(text) {
      const lines = [];
      for (const raw of text.split('\n')) {
        const m = raw.trim().match(/^\[(\d{1,2}):(\d{2})[.,](\d{2,3})\](.*)$/);
        if (!m) continue;
        const time = parseInt(m[1]) * 60 + parseInt(m[2]) + parseInt(m[3].padEnd(3, '0')) / 1000;
        const lyric = m[4].trim();
        if (lyric) lines.push({ time, text: lyric });
      }
      return lines.sort((a, b) => a.time - b.time);
    }

    function renderLrc() {
      lyricsEl.className = 'lrc-mode';
      lyricsEl.innerHTML = '';
      lrcLines.forEach(line => {
        const div = document.createElement('div');
        div.className = 'lrc-line lrc-future';
        div.textContent = line.text;
        lyricsEl.appendChild(div);
      });
      lrcActive = -1;
      lyricsContainer.scrollTop = 0;
    }

    function updateLrcHighlight() {
      if (!lrcMode || !lrcLines.length) return;
      const t = audioEl.currentTime;
      let idx = -1;
      for (let i = 0; i < lrcLines.length; i++) {
        if (lrcLines[i].time <= t) idx = i;
        else break;
      }
      if (idx === lrcActive) return;
      lrcActive = idx;
      const divs = lyricsEl.querySelectorAll('.lrc-line');
      divs.forEach((el, i) => {
        el.className = 'lrc-line ' + (i < idx ? 'lrc-past' : i === idx ? 'lrc-current' : 'lrc-future');
      });
      if (idx >= 0 && divs[idx]) {
        const el = divs[idx];
        const target = el.offsetTop - lyricsContainer.clientHeight / 2 + el.offsetHeight / 2;
        lyricsContainer.scrollTo({ top: target, behavior: 'smooth' });
      }
    }

    async function loadLrcAndRender(url) {
      lyricsEl.className = 'loading';
      lyricsEl.textContent = 'Carregant karaoke...';
      lyricsContainer.scrollTop = 0;
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error();
        lrcLines = parseLrc(await resp.text());
        renderLrc();
      } catch {
        lyricsEl.className = 'loading';
        lyricsEl.textContent = "No s'ha pogut carregar el karaoke.";
        lrcMode = false;
        btnLrc.classList.remove('active');
      }
    }

    btnLrc.addEventListener('click', () => {
      const song = playlist[currentIdx];
      lrcMode = !lrcMode;
      btnLrc.classList.toggle('active', lrcMode);
      if (lrcMode) {
        loadLrcAndRender(song.lrc);
      } else {
        lrcLines  = [];
        lrcActive = -1;
        if (song.lyrics) loadLyrics(song.lyrics);
        else { lyricsEl.className = 'loading'; lyricsEl.textContent = 'Lletra no disponible.'; }
      }
    });

    audioEl.addEventListener('timeupdate', updateLrcHighlight);

    // ── navigation ─────────────────────────────────────────────────────────
    function updateNav() {
      btnPrev.disabled = currentIdx === 0;
      btnNext.disabled = currentIdx === playlist.length - 1;
    }

    function loadSong(i) {
      currentIdx = i;
      const song = playlist[i];

      // Reset LRC state; keep lrcMode if new song also has lrc
      lrcLines  = [];
      lrcActive = -1;
      if (lrcMode && !song.lrc) {
        lrcMode = false;
        btnLrc.classList.remove('active');
      }
      btnLrc.disabled = !song.lrc;
      btnYoutube.disabled = !song.youtube;

      document.title = song.title;
      document.getElementById('title').textContent = song.title;
      history.replaceState(null, '', `player.html?playlist=${playlistName}&idx=${i}`);
      updateNav();

      if (song.audio) {
        audioEl.src = toAudioUrl(song.audio);
        audioEl.style.display = '';
        audioEl.play().catch(() => overlay.classList.add('visible'));
      } else {
        audioEl.src = '';
        audioEl.style.display = 'none';
        lyricsEl.className = 'loading';
        lyricsEl.textContent = 'Cançó no disponible encara.';
        lyricsContainer.scrollTop = 0;
        return;
      }

      if (lrcMode && song.lrc) {
        loadLrcAndRender(song.lrc);
      } else if (song.lyrics) {
        loadLyrics(song.lyrics);
      } else {
        lyricsEl.className = 'loading';
        lyricsEl.textContent = 'Lletra no disponible.';
      }
    }

    overlay.addEventListener('click', () => { audioEl.play(); overlay.classList.remove('visible'); });
    btnPrev.addEventListener('click', () => { if (currentIdx > 0) loadSong(currentIdx - 1); });
    btnNext.addEventListener('click', () => { if (currentIdx < playlist.length - 1) loadSong(currentIdx + 1); });
    audioEl.addEventListener('ended', () => {
      let next = currentIdx + 1;
      while (next < playlist.length && !playlist[next].audio) next++;
      if (next < playlist.length) loadSong(next);
    });

    // ── init ───────────────────────────────────────────────────────────────
    async function init() {
      try {
        const resp = await fetch(`playlists/${playlistName}.json`);
        const data = await resp.json();
        playlist = data.songs;
        if (currentIdx < 0 || currentIdx >= playlist.length) currentIdx = 0;
        loadSong(currentIdx);
      } catch {
        document.getElementById('title').textContent = 'Error carregant la playlist';
        lyricsEl.className = 'loading';
        lyricsEl.textContent = "No s'ha pogut carregar la playlist.";
      }
    }

    init();
  </script>
</body>
</html>
