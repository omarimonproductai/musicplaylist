<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecciona playlist</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-selector">
  <h1>Playlists</h1>
  <ul id="list"><li class="loading">Carregant...</li></ul>
  <script>
    fetch('playlists/index.json')
      .then(r => r.json())
      .then(names => Promise.all(
        names.map(name =>
          fetch(`playlists/${name}.json`)
            .then(r => r.json())
            .then(data => ({ name, title: data.title }))
        )
      ))
      .then(playlists => {
        const ul = document.getElementById('list');
        ul.innerHTML = '';
        playlists.forEach(({ name, title }) => {
          const li = document.createElement('li');
          li.innerHTML = `<a href="playlist.html?playlist=${name}">${title}</a>`;
          ul.appendChild(li);
        });
      });
  </script>
</body>
</html>
