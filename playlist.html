<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-playlist">
  <nav class="top-nav">
    <a class="back" href="playlist_selector.html">&#8592; Playlists</a>
  </nav>
  <h1 id="title"></h1>
  <ol id="list"></ol>
  <script>
    const params = new URLSearchParams(location.search);
    const playlistName = params.get('playlist') || '';

    fetch(`playlists/${playlistName}.json`)
      .then(r => r.json())
      .then(data => {
        document.title = data.title;
        document.getElementById('title').textContent = data.title;
        const ol = document.getElementById('list');
        data.songs.forEach((s, i) => {
          const li = document.createElement('li');
          if (s.audio) {
            li.innerHTML = `<a href="player.html?playlist=${playlistName}&idx=${i}">${s.title}</a>`;
          } else {
            li.innerHTML = `<span class="unavailable">${s.title}</span>`;
          }
          ol.appendChild(li);
        });
      });
  </script>
  
</body>
</html>
